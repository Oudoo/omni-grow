global
  log stdout format raw local0
  maxconn 4096

defaults
  mode tcp
  log global
  timeout connect 10s
  timeout client 2h
  timeout server 2h

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

# TURN/TLS is advertised on 443 by LiveKit. Route its SNI to the SFU
# without decrypting it; all web TLS goes to Caddy on the same VPS address.
frontend public_tls
  bind :8443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend turn_tls if { req.ssl_sni -i "${OG_TURN_HOST}" }
  default_backend web_tls

backend turn_tls
  server meetings meetings:5349 check resolvers docker init-addr libc,none

backend web_tls
  server proxy proxy:443 check send-proxy-v2 resolvers docker init-addr libc,none
